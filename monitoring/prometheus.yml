# Prometheus configuration for metrics scraping

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Research Platform API metrics
  - job_name: 'research-platform'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics/prometheus'
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
