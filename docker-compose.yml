version: '3.8'

services:
  # Main application service (API + Workers)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-assistant
    command: python scripts/run_service.py
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - DATABASE_URL=postgresql://research:research@postgres:5432/research_db
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
      - NUM_WORKERS=2
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - RELOAD_ENABLED=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - research-network
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend UI
  frontend:
    image: node:20-alpine
    container_name: research-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8000
      - API_PROXY_TARGET=http://app:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - app
    networks:
      - research-network
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: research-postgres
    environment:
      - POSTGRES_USER=research
      - POSTGRES_PASSWORD=research
      - POSTGRES_DB=research_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - research-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U research -d research_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: research-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - research-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow tracking server
  mlflow:
    image: python:3.10-slim
    container_name: research-mlflow
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow>=2.0.0 && 
             mlflow server 
             --backend-store-uri sqlite:///mlflow/mlflow.db 
             --default-artifact-root /mlflow/artifacts 
             --host 0.0.0.0 
             --port 5000
             --allowed-hosts '*'
             --cors-allowed-origins '*'"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - research-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: research-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - research-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: research-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - research-network
    depends_on:
      - prometheus

networks:
  research-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
