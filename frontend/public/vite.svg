<?xml version="1.0" encoding="UTF-8"?>
<svg
    width="512"
    height="512"
    viewBox="0 0 512 512"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="AI Logo">

    <!-- Background -->
    <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F172A"/>

    <!-- Neural node circle -->
    <circle cx="256" cy="256" r="120" fill="none" stroke="#38BDF8" stroke-width="10"/>

    <!-- Neural connections -->
    <line x1="256" y1="96" x2="256" y2="176" stroke="#38BDF8" stroke-width="6"/>
    <line x1="256" y1="336" x2="256" y2="416" stroke="#38BDF8" stroke-width="6"/>
    <line x1="96" y1="256" x2="176" y2="256" stroke="#38BDF8" stroke-width="6"/>
    <line x1="336" y1="256" x2="416" y2="256" stroke="#38BDF8" stroke-width="6"/>

    <line x1="146" y1="146" x2="206" y2="206" stroke="#38BDF8" stroke-width="6"/>
    <line x1="366" y1="146" x2="306" y2="206" stroke="#38BDF8" stroke-width="6"/>
    <line x1="146" y1="366" x2="206" y2="306" stroke="#38BDF8" stroke-width="6"/>
    <line x1="366" y1="366" x2="306" y2="306" stroke="#38BDF8" stroke-width="6"/>

    <!-- AI text -->
    <text
        x="256"
        y="286"
        text-anchor="middle"
        font-size="96"
        font-weight="700"
        fill="#E5E7EB"
        font-family="Inter, Arial, sans-serif">
        AI
    </text>
</svg>
